<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="TheCryptoDesk">
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#22e0ff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="#05070d"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <!-- The brand mark, held back so a real cover always outranks it. -->
  <g transform="translate(540 278) scale(1.2)" opacity="0.3">
    <polygon points="50,6 90,46 10,46" fill="#22e0ff"/>
    <polygon points="10,54 90,54 50,94" fill="none" stroke="#22e0ff" stroke-width="7" stroke-linejoin="round"/>
  </g>
  <rect x="540" y="430" width="120" height="3" fill="#a36bff" opacity="0.4"/>
</svg>
