# Firebase App Hosting configuration for the Next.js frontend.
# Docs: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Keep at least one warm instance for fast SSR / good SEO crawl response.
  # Cold starts directly cost crawl budget on a site that publishes hourly.
  minInstances: 1
  maxInstances: 2
  # Lowered from 80 alongside enabling the Next image optimizer: sharp decodes
  # a full-size cover to raw RGBA before encoding, so concurrent optimizations
  # are the memory spike this instance is most likely to die on.
  concurrency: 40
  cpu: 1
  # Raised from 512. The optimizer's on-disk cache (`.next/cache/images`) is
  # tmpfs on Cloud Run and counts against this limit, on top of sharp's own
  # working set.
  memoryMiB: 1024

env:
  # Caps glibc's per-thread malloc arenas. sharp fragments heap badly under the
  # default on Cloud Run's glibc image, which shows up as gradual RSS growth and
  # eventual OOM kills rather than an obvious crash.
  - variable: MALLOC_ARENA_MAX
    value: "2"
    availability:
      - RUNTIME

  # Public site URL — used to build canonical URLs, the sitemap and robots.txt.
  # Change this to your real domain once deployed.
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://thecryptodesk.com
    availability:
      - BUILD
      - RUNTIME

  # Analytics and Search Console are OPT-IN and intentionally absent here.
  # The app treats an unset variable as "disabled": no gtag script is rendered
  # without NEXT_PUBLIC_GA_ID, and no verification meta tag without
  # NEXT_PUBLIC_GSC_VERIFICATION. Do NOT add them back with `value: ""` --
  # App Hosting reads an empty value as no value at all and rejects the whole
  # file with "either 'value' or 'secret' field is required".
  #
  # To enable, uncomment and supply the real value:
  #
  # - variable: NEXT_PUBLIC_GA_ID
  #   value: G-XXXXXXXXXX
  #   availability:
  #     - BUILD
  #     - RUNTIME
  #
  # Only needed if verifying Search Console by HTML tag rather than DNS TXT:
  #
  # - variable: NEXT_PUBLIC_GSC_VERIFICATION
  #   value: your-verification-token
  #   availability:
  #     - BUILD
  #     - RUNTIME

  # Envelope sender for contact-form notifications. MUST be an address Resend
  # will accept; the submitter rides in Reply-To, never in From, because
  # sending as them fails SPF/DKIM at the receiving end.
  #
  # TEMPORARY: thecryptodesk.com is NOT yet verified in Resend, and sending
  # from an unverified domain is refused outright with a 403. `onboarding@
  # resend.dev` is Resend's shared sender, which works with no DNS setup but
  # will only deliver to the Resend account owner's own address -- hence the
  # CONTACT_TO_EMAIL override below. Swap both back to the branded addresses
  # once the domain is verified at https://resend.com/domains.
  - variable: MAIL_FROM
    value: TheCryptoDesk <onboarding@resend.dev>
    availability:
      - RUNTIME

  # TEMPORARY, paired with MAIL_FROM above: the shared sender cannot deliver to
  # contact@thecryptodesk.com, and that mailbox needs an email host to exist at
  # all -- Resend only sends, it does not receive. Remove this line once the
  # domain is verified AND contact@ is a real mailbox, and the form will fall
  # back to CONTACT_EMAIL, which is what the site publishes.
  - variable: CONTACT_TO_EMAIL
    value: kalum@11votes.com
    availability:
      - RUNTIME

  # Contact form delivery. The secret itself lives in Secret Manager and is
  # never in this file or the repo:
  #   firebase apphosting:secrets:set resend-api-key
  - variable: RESEND_API_KEY
    secret: resend-api-key
    availability:
      - RUNTIME
